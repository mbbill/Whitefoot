# Completion I/O evidence from hosts the maintainer's machine cannot produce:
# a real Linux kernel on real hardware, Windows at all, and an ordinary macOS
# system without a corporate endpoint-security stack in the I/O path.
#
# These jobs retain execution evidence rather than relying on cross-builds.
# A correctness job here fails loudly rather than recording a fallback:
# `completion-linux` requires io_uring, and `completion-windows` exercises both
# IOCP and the native compute pool through the production compiler, reporting
# exact backend failures instead of marking them expected-to-fail. The bench
# jobs that record performance live in `io-bench.yml`: they run on demand and
# when the runtime or the bench bundle changes, so a push is never waiting on a
# fifteen-minute measurement that judges nothing.
name: io-hosts

on:
  push:
  workflow_dispatch:

concurrency:
  group: io-hosts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  completion-linux:
    name: completion-linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          test -x /usr/bin/clang
          /usr/bin/clang --version

      - name: Record the kernel
        run: |
          uname -srvmo
          nproc
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'absent')"

      # The compiler's own `completion-test` tolerates exit 77 from this probe,
      # because a build host is allowed to lack io_uring. A CI job whose whole
      # purpose is native-adapter evidence must not: 77 here is a failure, so
      # a silent fallback can never be reported as an io_uring result.
      - name: Native io_uring adapter probe (required)
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          /usr/bin/clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -pthread \
            -DWF_COMPLETION_GETDIRENTRIES64=wf_completion_test_getdirentries64 \
            -DWF_COMPLETION_GETDENTS64=wf_completion_test_getdents64 \
            -DWF_COMPLETION_POLL=wf_completion_test_poll \
            compiler/src/backend/sched/core.c \
            compiler/src/backend/sched/prim_host.c \
            compiler/src/backend/sched/entry.c \
            compiler/src/backend/completion/runtime.c \
            compiler/src/backend/completion/wait_host.c \
            compiler/src/backend/completion/linux_io_uring.c \
            compiler/src/backend/completion/native_adapter_probe.c \
            -o "$RUNNER_TEMP/completion/linux-native-probe"
          set +e
          "$RUNNER_TEMP/completion/linux-native-probe" "$RUNNER_TEMP/completion/probe.data"
          status=$?
          set -e
          echo "native adapter probe exit status: $status"
          if [ "$status" -eq 77 ]; then
            echo "io_uring is unavailable on this runner; this job reports that as a failure rather than as a pass on the fallback path" >&2
            exit 1
          fi
          exit "$status"

      - name: Completion harness
        run: make -C compiler completion-test CC=/usr/bin/clang

      # `completion-test` re-runs the harness under WF_REQUIRE_LINUX_IO_URING
      # at one helper count only. Naming all three here states that the
      # required-io_uring path holds across the helper policies the runtime
      # actually selects between.
      - name: Completion harness with io_uring required
        run: |
          harness="$HOME/do_not_scan/whitefoot-completion-test/harness"
          for helpers in 0 1 4; do
            echo "== WF_REQUIRE_LINUX_IO_URING=1 WF_IO_HELPERS=$helpers =="
            WF_REQUIRE_LINUX_IO_URING=1 WF_IO_HELPERS="$helpers" \
              "$harness" "$HOME/do_not_scan/whitefoot-completion-test"
          done

      - name: Address and undefined sanitizers
        run: make -C compiler completion-sanitize CC=/usr/bin/clang

      # Two thread-sanitizer runs, because they cover disjoint code. The
      # core/read probe links neither the bridge nor the writer scheduler by
      # construction, so the helper pool, the queue wake and the join spin --
      # every thread the delivered runtime actually starts -- are outside it.
      # The default-route probe runs those, on the helper policy a delivered
      # program gets.
      - name: Thread sanitizer
        run: |
          make -C compiler completion-core-read-tsan CC=/usr/bin/clang
          make -C compiler completion-default-route-tsan CC=/usr/bin/clang

      - name: Thread sanitizer over the bridge and the ring
        run: make -C compiler completion-tsan CC=/usr/bin/clang

  completion-windows:
    name: completion-windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record the host
        run: |
          clang --version
          systeminfo | grep -E '^(OS Name|OS Version|System Type|Total Physical Memory)' || true

      # The runtime the driver stages on this target, in the three groups it
      # stages: the scheduler core with its Windows leaf, the completion
      # runtime with its Windows wait, host leaf and ring, and the Windows host
      # runtime beside them. It is the POSIX list with the leaves swapped,
      # which is what step (iv) is.
      - name: Record the Windows runtime link set
        run: |
          {
            echo "WINDOWS_UNITS<<EOF"
            echo "compiler/src/backend/sched/core.c"
            echo "compiler/src/backend/sched/prim_windows.c"
            echo "compiler/src/backend/sched/entry.c"
            echo "compiler/src/backend/completion/runtime.c"
            echo "compiler/src/backend/completion/wait_windows.c"
            echo "compiler/src/backend/completion/file_adapter.c"
            echo "compiler/src/backend/completion/file_windows.c"
            echo "compiler/src/backend/completion/bridge.c"
            echo "compiler/src/backend/completion/windows_iocp.c"
            echo "compiler/src/backend/windows_runtime.c"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # The shipped default helper policy and the shipped routing, on the real
      # host, through the same probe the POSIX gate runs: this is the same
      # source, the same assertions and the same PASS line on both platforms,
      # which is the property step (iv) is about. It is run twice, because the
      # two routes are two different engines for one writer-visible operation:
      # once with the completion port (route=native-ring) and once with the
      # port refused (route=posix-adapter), which is the negative control the
      # POSIX `completion-default-route-test` also runs.
      - name: Build the Windows default-route probe
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            $WINDOWS_UNITS \
            compiler/src/backend/completion/bridge_default_probe.c \
            -o "$RUNNER_TEMP/completion/windows-default-route-probe.exe"

      - name: Run the Windows default-route probe on both routes
        run: |
          record="$RUNNER_TEMP/completion/windows-default-route"
          "$RUNNER_TEMP/completion/windows-default-route-probe.exe" \
            "$RUNNER_TEMP/completion" 2> "$record-ring.txt"
          cat "$record-ring.txt"
          tr -d $'\r' < "$record-ring.txt" | grep -F 'route=native-ring' > /dev/null
          WF_IO_NO_NATIVE_RING=1 \
            "$RUNNER_TEMP/completion/windows-default-route-probe.exe" \
            "$RUNNER_TEMP/completion" 2> "$record-adapter.txt"
          cat "$record-adapter.txt"
          tr -d $'\r' < "$record-adapter.txt" | grep -F 'route=posix-adapter' > /dev/null

      # The ring alone, with no bridge at all: a real positioned transfer found
      # by the record's own address, published through the scheduler core, and
      # waited for on the ring's own park.
      - name: Build the Windows native adapter probe
        run: |
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            compiler/src/backend/sched/core.c \
            compiler/src/backend/sched/prim_windows.c \
            compiler/src/backend/completion/runtime.c \
            compiler/src/backend/completion/wait_windows.c \
            compiler/src/backend/completion/native_contract.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/native_adapter_probe.c \
            -o "$RUNNER_TEMP/completion/windows-adapter-probe.exe"

      - name: Run the Windows native adapter probe
        run: |
          "$RUNNER_TEMP/completion/windows-adapter-probe.exe" \
            "$RUNNER_TEMP/completion/adapter.data"

      # This probe proves the namespace facilities the Windows target row
      # uses. It moves the ambient cwd away after taking its directory
      # handle, then uses NtCreateFile and NtQueryDirectoryFile through that
      # handle. A runner unable to create the reparse-point fixture exits 77;
      # this evidence job treats that as fail-closed rather than a partial pass.
      - name: Build the Windows native namespace probe
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            compiler/src/backend/windows_namespace_probe.c \
            -o "$RUNNER_TEMP/completion/windows-namespace-probe.exe"

      - name: Run the Windows native namespace probe
        run: |
          set +e
          "$RUNNER_TEMP/completion/windows-namespace-probe.exe"
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "the runner could not create the reparse-point fixture; Windows namespace qualification remains fail-closed" >&2
            exit 1
          fi
          exit "$status"

      # The whole staged runtime plus the floor, under the warning set the
      # repository gate uses. There is deliberately no second pass under
      # `-DWF_SCHED_ENUMERATE`: the enumerator (`sched/enumerate.c`) is a POSIX
      # test harness that reserves its own coroutine stacks with `mmap`, it is
      # not staged into any link on this target, and it is not meant to compile
      # here.
      - name: Strict-check the complete Windows runtime
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic -fsyntax-only \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            $WINDOWS_UNITS \
            compiler/src/backend/wf_floor_windows.c

      # A bridge with no engine at all is a trusted-computing-base failure and
      # terminates where the floor does. Rename the bridge's two initializers
      # in the bridge object only, leave every other unit on its production
      # implementation, and require the production fail-stop path to terminate
      # before a submit can return. A *refused ring* is not that case and must
      # not be: the default-route step above runs exactly that configuration.
      - name: Build the Windows bridge initialization fail-stop probe
        run: |
          fault_dir="$RUNNER_TEMP/completion/windows-bridge-init-fault"
          mkdir -p "$fault_dir"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -DWF_WINDOWS_BRIDGE_INIT_PROBE_DECLARATIONS=1 \
            -include compiler/src/backend/completion/windows_bridge_init_fail_stop_probe.c \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            -c compiler/src/backend/completion/bridge.c \
            -o "$fault_dir/bridge.o"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            compiler/src/backend/sched/core.c \
            compiler/src/backend/sched/prim_windows.c \
            compiler/src/backend/sched/entry.c \
            compiler/src/backend/completion/runtime.c \
            compiler/src/backend/completion/wait_windows.c \
            compiler/src/backend/completion/file_adapter.c \
            compiler/src/backend/completion/file_windows.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/windows_runtime.c \
            compiler/src/backend/completion/windows_bridge_init_fail_stop_probe.c \
            "$fault_dir/bridge.o" \
            -o "$fault_dir/windows-bridge-init-fail-stop-probe.exe"

      - name: Require Windows bridge initialization to fail stop
        run: |
          fault_dir="$RUNNER_TEMP/completion/windows-bridge-init-fault"
          set +e
          "$fault_dir/windows-bridge-init-fail-stop-probe.exe" \
            > "$fault_dir/stdout.txt" 2> "$fault_dir/stderr.txt"
          status=$?
          set -e
          if [ "$status" -ne 86 ]; then
            echo "bridge initialization fault exited ${status}, expected 86" >&2
            exit 1
          fi
          if [ -s "$fault_dir/stdout.txt" ] || [ -s "$fault_dir/stderr.txt" ]; then
            echo "bridge initialization fault wrote unexpected output" >&2
            exit 1
          fi

      # A native adapter probe can pass while the compiler still emits a Unix
      # bootstrap or the shipped driver forgets one Windows runtime unit. This
      # is the production boundary: native whitefootc emits and links a real
      # .wf program, whose two argument paths are UTF-16, whose files are
      # opened relative to command.cwd, whose first independent read_at must
      # submit to IOCP, and whose bytes leave through Output.write_once. The
      # opt-in runtime assertion aborts at process exit unless at least one
      # IOCP submission was also reaped, so a silent direct fallback cannot
      # satisfy this step.
      - name: Compile and run a real Whitefoot program through IOCP
        run: |
          fail_e2e() {
            local stage="$1"
            local status="$2"
            echo "::error title=Windows Whitefoot IOCP E2E::${stage} (exit ${status})"
            exit "$status"
          }
          cargo build --manifest-path compiler/Cargo.toml --locked --bin whitefootc || \
            fail_e2e "building whitefootc failed" "$?"
          mkdir -p "$RUNNER_TEMP/whitefoot-e2e"
          driver_diagnostics="$RUNNER_TEMP/whitefoot-e2e/whitefootc-diagnostics.txt"
          compiler/target/debug/whitefootc.exe \
            tests/programs/completion_read_boundary.wf \
            -o "$RUNNER_TEMP/whitefoot-e2e/completion-read-boundary.exe" \
            2> "$driver_diagnostics" || {
              status="$?"
              while IFS= read -r line; do
                line="${line//%/%25}"
                line="${line//$'\r'/%0D}"
                echo "::error title=Windows whitefootc diagnostic::${line}"
              done < "$driver_diagnostics"
              fail_e2e "whitefootc failed to compile or link the program" "$status"
            }
          printf 'A' > "$RUNNER_TEMP/whitefoot-e2e/first.bin"
          printf 'B' > "$RUNNER_TEMP/whitefoot-e2e/second.bin"
          printf 'AB' > "$RUNNER_TEMP/whitefoot-e2e/expected.txt"
          (
            cd "$RUNNER_TEMP/whitefoot-e2e"
            WF_REQUIRE_WINDOWS_IOCP=1 ./completion-read-boundary.exe \
              first.bin second.bin \
              > actual.txt 2> diagnostics.txt
          ) || fail_e2e "the compiled program failed under the IOCP requirement" "$?"
          cmp "$RUNNER_TEMP/whitefoot-e2e/expected.txt" \
            "$RUNNER_TEMP/whitefoot-e2e/actual.txt" || \
            fail_e2e "the compiled program produced the wrong bytes" "$?"
          test ! -s "$RUNNER_TEMP/whitefoot-e2e/diagnostics.txt" || \
            fail_e2e "the compiled program wrote diagnostics" "$?"

      # U+4241 is one native UTF-16 code unit whose little-endian memory bytes
      # are 0x41, 0x42. The program measures the HostString, copies its complete
      # lossless route, and requires bytes 0x41, 0x42. This is the native
      # qualification record for the wider-code-unit [SYS-9] target row.
      - name: Run the Windows HostString raw-code-unit boundary
        shell: pwsh
        run: |
          $program = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/host-string-bytes.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/host-string-bytes.out"
          $stderr = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/host-string-bytes.err"
          & ".\compiler\target\debug\whitefootc.exe" "tests/programs/host_string_bytes.wf" -o $program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $argument = [string][char]0x4241
          & $program $argument > $stdout 2> $stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $stdout).Length -ne 0) {
            throw "the HostString boundary wrote stdout"
          }
          if ((Get-Item $stderr).Length -ne 0) {
            throw "the HostString boundary wrote stderr"
          }

      # The HostString probe above and the native namespace probe cover the
      # two ends of this path independently. This compiler-emitted program
      # closes the boundary between them: it losslessly copies two wider-code-
      # unit argument names into source buffers and feeds those exact ranges to
      # open_file. U+4241 and U+4242 have little-endian bytes AB and BB, so the
      # ASCII decoys make an accidental byte-name interpretation observable.
      # The same source runs once with every operation direct, then through the
      # production completion lowering with IOCP required.
      - name: Open target-native Windows components from compiler-emitted buffers
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/windows-component-open"
          [void](New-Item -ItemType Directory -Force -Path $directory)
          $source = "research/experiments/io-completion-bench/programs/windows_component_open.wf"
          $compiler = ".\compiler\target\debug\whitefootc.exe"
          $direct = Join-Path $directory "component-open-direct.exe"
          $completion = Join-Path $directory "component-open-completion.exe"
          & $compiler --no-overlap $source -o $direct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler $source -o $completion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $nameA = [string][char]0x4241
          $nameB = [string][char]0x4242
          [IO.File]::WriteAllBytes((Join-Path $directory $nameA), [byte[]](87))
          [IO.File]::WriteAllBytes((Join-Path $directory $nameB), [byte[]](88))
          [IO.File]::WriteAllBytes((Join-Path $directory "AB"), [byte[]](68))
          [IO.File]::WriteAllBytes((Join-Path $directory "BB"), [byte[]](69))
          $expected = [byte[]](87, 88)

          Push-Location $directory
          try {
            & $direct $nameA $nameB > direct.out 2> direct.err
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:WF_REQUIRE_WINDOWS_IOCP = "1"
            & $completion $nameA $nameB > completion.out 2> completion.err
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item Env:WF_REQUIRE_WINDOWS_IOCP -ErrorAction SilentlyContinue
            Pop-Location
          }

          foreach ($variant in @("direct", "completion")) {
            $actual = [IO.File]::ReadAllBytes((Join-Path $directory "$variant.out"))
            if ($actual.Length -ne $expected.Length) {
              throw "$variant component-open output has the wrong length"
            }
            for ($index = 0; $index -lt $expected.Length; $index += 1) {
              if ($actual[$index] -ne $expected[$index]) {
                throw "$variant component-open output selected the wrong native name"
              }
            }
            if ((Get-Item (Join-Path $directory "$variant.err")).Length -ne 0) {
              throw "$variant component-open run wrote diagnostics"
            }
          }

      # Correct bytes alone would also be produced by a sequential fallback.
      # The production driver must preserve those bytes and reject malformed
      # pool configuration. Then the same real Whitefoot module is linked with
      # a test-only identity observer. Its counters are compiled out of every
      # production binary; this observed build requires a started non-owner
      # worker to have executed and stolen at least one source task.
      - name: Require native workers for a real --par program
        run: |
          fail_par() {
            local stage="$1"
            local status="${2:-1}"
            echo "::error title=Windows native parallel runtime::${stage}"
            exit "$status"
          }
          par_dir="$RUNNER_TEMP/whitefoot-e2e/windows-par"
          mkdir -p "$par_dir"
          compiler/target/debug/whitefootc.exe \
            tests/programs/par_layout.wf \
            -o "$par_dir/par-layout-reference.exe" || \
            fail_par "the sequential reference did not link" "$?"
          compiler/target/debug/whitefootc.exe --par \
            tests/programs/par_layout.wf \
            -o "$par_dir/par-layout-production.exe" || \
            fail_par "the production --par executable did not link" "$?"
          compiler/target/debug/whitefootc.exe --par --emit-llvm \
            tests/programs/par_layout.wf \
            -o "$par_dir/par-layout.ll" || \
            fail_par "the observed --par module did not emit" "$?"

          "$par_dir/par-layout-reference.exe" \
            > "$par_dir/reference.txt" 2> "$par_dir/reference.err" || \
            fail_par "the sequential reference failed" "$?"
          set +e
          WF_WORKERS=4 \
            "$par_dir/par-layout-production.exe" \
            > "$par_dir/production.txt" 2> "$par_dir/production.err"
          production_status="$?"
          set -e
          if test "$production_status" -ne 0; then
            sed 's/^/native parallel production: /' \
              "$par_dir/production.err" >&2
            fail_par \
              "the production --par executable failed" \
              "$production_status"
          fi
          cmp "$par_dir/reference.txt" "$par_dir/production.txt" || \
            fail_par "native workers changed the program bytes" "$?"
          test ! -s "$par_dir/reference.err" || \
            fail_par "the sequential reference wrote diagnostics"
          test ! -s "$par_dir/production.err" || \
            fail_par "the native worker run wrote diagnostics"

          set +e
          WF_WORKERS=not-a-count "$par_dir/par-layout-production.exe" \
            > "$par_dir/invalid.txt" 2> "$par_dir/invalid.err"
          invalid_status="$?"
          set -e
          test "$invalid_status" -ne 0 || \
            fail_par "malformed WF_WORKERS silently selected a fallback"
          test ! -s "$par_dir/invalid.txt" || \
            fail_par "the rejected configuration entered the Whitefoot program"
          tr -d $'\r' < "$par_dir/invalid.err" > "$par_dir/invalid.normalized"
          grep -Fx \
            'whitefoot scheduler: WF_WORKERS must be an integer from 0 through 64' \
            "$par_dir/invalid.normalized" > /dev/null || \
            fail_par "the configuration failure did not identify the runtime cause"

          # Correct bytes and a rejected configuration would both also be
          # produced by a pool that started and never granted a lane. The same
          # module is therefore linked once more with the observer POSIX uses
          # for exactly this proof -- `sched/grant_observer.c`, which reports
          # the core's own steal count at process exit and is linked into no
          # shipped program -- against the runtime the driver stages here.
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -municode \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            $WINDOWS_UNITS \
            compiler/src/backend/wf_floor_windows.c \
            compiler/src/backend/sched/grant_observer.c \
            -x ir "$par_dir/par-layout.ll" \
            -Wno-override-module \
            -o "$par_dir/par-layout-observed.exe" || \
            fail_par "the observed executable did not link" "$?"
          WF_WORKERS=4 "$par_dir/par-layout-observed.exe" \
            > "$par_dir/observed.txt" 2> "$par_dir/observed.err" || {
              status="$?"
              sed 's/^/native parallel observer: /' "$par_dir/observed.err" >&2
              fail_par "the observed --par run failed" "$status"
            }
          cmp "$par_dir/reference.txt" "$par_dir/observed.txt" || \
            fail_par "the observed native run changed the program bytes" "$?"
          tr -d $'\r' < "$par_dir/observed.err" > "$par_dir/observed.normalized"
          test "$(wc -l < "$par_dir/observed.normalized")" -eq 1 || \
            fail_par "the observed run wrote unexpected diagnostics"
          grep -E '^grants=[1-9][0-9]*$' \
            "$par_dir/observed.normalized" > /dev/null || \
            fail_par "no non-owner worker executed source work"

      # The floor, on a pool stack that is a fiber.
      #
      # Every other step here would pass with the floor off: this is the one
      # that says an overflow *on a stack the scheduler core made* is still the
      # one classified abnormal end a correct program can reach. It matters
      # more on this platform than on the other, because the two halves it
      # exercises are both Windows's own -- a fiber's stack is the kernel's and
      # not a mapping of ours, and the classification is by exception code with
      # `SetThreadStackGuarantee`'s emergency stack under it, where POSIX
      # classifies by address against bounds the switch writes.
      #
      # Twice, because the two runs reach the guard on different stacks: at the
      # shipped default the recursion is carried by whichever thread the pool
      # gives it, and at `WF_WORKERS=4` the deep half is handed out, so the
      # descent runs on a worker's pool fiber rather than the entry's.
      - name: Require the floor to classify an overflow on a pool fiber
        run: |
          fail_floor() {
            local stage="$1"
            local status="${2:-1}"
            echo "::error title=Windows floor on a pool fiber::${stage}"
            exit "$status"
          }
          floor_dir="$RUNNER_TEMP/whitefoot-e2e/windows-floor"
          mkdir -p "$floor_dir"
          # The same shape `backend/tests/exhaustion.rs` drives on POSIX: a
          # recursion the host optimizer cannot turn back into a loop, whose
          # two callees are an eligible overlap pair, at a depth past every
          # thread's ceiling.
          cat > "$floor_dir/runaway.wf" <<'WF'
          fn leafval(v: own f64) -> result: own f64 pure {
            return fmul.strict(v, 0.5_f64);
          }

          fn spine(depth: own u64, v: own f64) -> result: own f64 pure {
            let done = depth == 0_u64;
            if done {
              return v;
            }
            let next = depth -wrap 1_u64;
            let a = spine(depth: next, v: v);
            let b = leafval(v: v);
            return fadd.strict(a, b);
          }

          command fn main() -> status: own ExitStatus pure {
            let total = spine(depth: 100000000_u64, v: 1.0009765625_f64);
            let bits = reinterpret::<f64, u64>(total);
            let low = iand(bits, 1_u64);
            match cvt::<u64, u8>(low) {
              Ok(value: byte) => {
                return exit_status(code: byte);
              }
              Err(error: wide) => {
                return exit_status(code: 9_u8);
              }
            }
          }
          WF
          compiler/target/debug/whitefootc.exe --par \
            "$floor_dir/runaway.wf" -o "$floor_dir/runaway.exe" || \
            fail_floor "the runaway recursion did not link" "$?"
          for workers in default 4; do
            set +e
            if [ "$workers" = default ]; then
              "$floor_dir/runaway.exe" \
                > "$floor_dir/out.txt" 2> "$floor_dir/err.txt"
            else
              WF_WORKERS="$workers" "$floor_dir/runaway.exe" \
                > "$floor_dir/out.txt" 2> "$floor_dir/err.txt"
            fi
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              fail_floor "WF_WORKERS=${workers}: the runaway recursion returned a status"
            fi
            if [ -s "$floor_dir/out.txt" ]; then
              fail_floor "WF_WORKERS=${workers}: an exhausted execution wrote program output"
            fi
            tr -d $'\r' < "$floor_dir/err.txt" > "$floor_dir/err.normalized"
            grep -Fx '{"resource":"stack"}' "$floor_dir/err.normalized" > /dev/null || \
              fail_floor "WF_WORKERS=${workers}: the exhaustion record is not the one record"
            test "$(wc -l < "$floor_dir/err.normalized")" -eq 1 || \
              fail_floor "WF_WORKERS=${workers}: more than one record reached the channel"
          done

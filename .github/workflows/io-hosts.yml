# Completion I/O evidence from hosts the maintainer's machine cannot produce:
# a real Linux kernel on real hardware, Windows at all, and an ordinary macOS
# system without a corporate endpoint-security stack in the I/O path.
#
# These jobs retain execution evidence rather than relying on cross-builds.
# A correctness job here fails loudly rather than recording a fallback:
# `completion-linux` requires io_uring, and `completion-windows` exercises both
# IOCP and the native compute pool through the production compiler, reporting
# exact backend failures instead of marking them expected-to-fail. The bench
# jobs that record performance live in `io-bench.yml`: they run on demand and
# when the runtime or the bench bundle changes, so a push is never waiting on a
# fifteen-minute measurement that judges nothing.
name: io-hosts

on:
  push:
  workflow_dispatch:

concurrency:
  group: io-hosts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  completion-linux:
    name: completion-linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          test -x /usr/bin/clang
          /usr/bin/clang --version

      - name: Record the kernel
        run: |
          uname -srvmo
          nproc
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'absent')"

      # The compiler's own `completion-test` tolerates exit 77 from this probe,
      # because a build host is allowed to lack io_uring. A CI job whose whole
      # purpose is native-adapter evidence must not: 77 here is a failure, so
      # a silent fallback can never be reported as an io_uring result.
      - name: Native io_uring adapter probe (required)
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          /usr/bin/clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -pthread \
            -DWF_COMPLETION_GETDIRENTRIES64=wf_completion_test_getdirentries64 \
            -DWF_COMPLETION_GETDENTS64=wf_completion_test_getdents64 \
            -DWF_COMPLETION_POLL=wf_completion_test_poll \
            compiler/src/backend/completion/runtime.c \
            compiler/src/backend/completion/linux_io_uring.c \
            compiler/src/backend/completion/native_adapter_probe.c \
            -o "$RUNNER_TEMP/completion/linux-native-probe"
          set +e
          "$RUNNER_TEMP/completion/linux-native-probe" "$RUNNER_TEMP/completion/probe.data"
          status=$?
          set -e
          echo "native adapter probe exit status: $status"
          if [ "$status" -eq 77 ]; then
            echo "io_uring is unavailable on this runner; this job reports that as a failure rather than as a pass on the fallback path" >&2
            exit 1
          fi
          exit "$status"

      - name: Completion harness
        run: make -C compiler completion-test CC=/usr/bin/clang

      # `completion-test` re-runs the harness under WF_REQUIRE_LINUX_IO_URING
      # at one helper count only. Naming all three here states that the
      # required-io_uring path holds across the helper policies the runtime
      # actually selects between.
      - name: Completion harness with io_uring required
        run: |
          harness="$HOME/do_not_scan/whitefoot-completion-test/harness"
          for helpers in 0 1 4; do
            echo "== WF_REQUIRE_LINUX_IO_URING=1 WF_IO_HELPERS=$helpers =="
            WF_REQUIRE_LINUX_IO_URING=1 WF_IO_HELPERS="$helpers" \
              "$harness" "$HOME/do_not_scan/whitefoot-completion-test"
          done

      - name: Address and undefined sanitizers
        run: make -C compiler completion-sanitize CC=/usr/bin/clang

      # Two thread-sanitizer runs, because they cover disjoint code. The
      # core/read probe links neither the bridge nor the writer scheduler by
      # construction, so the helper pool, the queue wake and the join spin --
      # every thread the delivered runtime actually starts -- are outside it.
      # The default-route probe runs those, on the helper policy a delivered
      # program gets.
      - name: Thread sanitizer
        run: |
          make -C compiler completion-core-read-tsan CC=/usr/bin/clang
          make -C compiler completion-default-route-tsan CC=/usr/bin/clang

      - name: Thread sanitizer over the bridge and the ring
        run: make -C compiler completion-tsan CC=/usr/bin/clang

  completion-windows:
    name: completion-windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record the host
        run: |
          clang --version
          systeminfo | grep -E '^(OS Name|OS Version|System Type|Total Physical Memory)' || true

      # The cross target proves that these units link into a PE importing the
      # IOCP entries. This native probe additionally proves that the adapter
      # drives a real completion port.
      - name: Build the Windows completion probe
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend/completion \
            compiler/src/backend/completion/windows_completion.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/windows_completion_probe.c \
            -o "$RUNNER_TEMP/completion/windows-completion-probe.exe"

      - name: Run the Windows completion probe
        run: |
          "$RUNNER_TEMP/completion/windows-completion-probe.exe" \
            "$RUNNER_TEMP/completion/probe.data"

      - name: Build the Windows native adapter probe
        run: |
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend/completion \
            compiler/src/backend/completion/native_contract.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/native_adapter_probe.c \
            -o "$RUNNER_TEMP/completion/windows-adapter-probe.exe"

      - name: Run the Windows native adapter probe
        run: |
          "$RUNNER_TEMP/completion/windows-adapter-probe.exe" \
            "$RUNNER_TEMP/completion/adapter.data"

      # This probe proves the namespace facilities the Windows target row
      # uses. It moves the ambient cwd away after taking its directory
      # handle, then uses NtCreateFile and NtQueryDirectoryFile through that
      # handle. A runner unable to create the reparse-point fixture exits 77;
      # this evidence job treats that as fail-closed rather than a partial pass.
      - name: Build the Windows native namespace probe
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            compiler/src/backend/windows_namespace_probe.c \
            -o "$RUNNER_TEMP/completion/windows-namespace-probe.exe"

      - name: Run the Windows native namespace probe
        run: |
          set +e
          "$RUNNER_TEMP/completion/windows-namespace-probe.exe"
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "the runner could not create the reparse-point fixture; Windows namespace qualification remains fail-closed" >&2
            exit 1
          fi
          exit "$status"

      - name: Strict-check the complete Windows runtime
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic -fsyntax-only \
            -DWF_PAR_WITH_WRITER_SCHEDULER=1 \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            compiler/src/backend/par_runtime_windows.c \
            compiler/src/backend/windows_runtime.c \
            compiler/src/backend/wf_floor_windows.c \
            compiler/src/backend/completion/windows_completion.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/windows_bridge.c \
            compiler/src/backend/completion/writer_scheduler_windows.c

      # Terminal IOCP packets do not free compiler core slots; source joins do.
      # Fill all 64 slots without joining, then require the 65th submit to
      # return its direct-fallback verdict within five seconds. The probe then
      # joins every admitted read and closes the submission/publication ledger.
      - name: Build the Windows bridge capacity probe
        run: |
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            compiler/src/backend/windows_runtime.c \
            compiler/src/backend/completion/windows_completion.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/windows_bridge.c \
            compiler/src/backend/completion/writer_scheduler_windows.c \
            compiler/src/backend/completion/windows_bridge_capacity_probe.c \
            -o "$RUNNER_TEMP/completion/windows-bridge-capacity-probe.exe"

      - name: Run the Windows bridge capacity probe
        run: |
          WF_REQUIRE_WINDOWS_IOCP=1 \
            "$RUNNER_TEMP/completion/windows-bridge-capacity-probe.exe" \
            "$RUNNER_TEMP/completion/windows-bridge-capacity.data"

      # A native adapter probe can pass while the compiler still emits a Unix
      # bootstrap or the shipped driver forgets one Windows runtime unit. This
      # is the production boundary: native whitefootc emits and links a real
      # .wf program, whose two argument paths are UTF-16, whose files are
      # opened relative to command.cwd, whose first independent read_at must
      # submit to IOCP, and whose bytes leave through Output.write_once. The
      # opt-in runtime assertion aborts at process exit unless at least one
      # IOCP submission was also reaped, so a silent direct fallback cannot
      # satisfy this step.
      - name: Compile and run a real Whitefoot program through IOCP
        run: |
          fail_e2e() {
            local stage="$1"
            local status="$2"
            echo "::error title=Windows Whitefoot IOCP E2E::${stage} (exit ${status})"
            exit "$status"
          }
          cargo build --manifest-path compiler/Cargo.toml --locked --bin whitefootc || \
            fail_e2e "building whitefootc failed" "$?"
          mkdir -p "$RUNNER_TEMP/whitefoot-e2e"
          driver_diagnostics="$RUNNER_TEMP/whitefoot-e2e/whitefootc-diagnostics.txt"
          compiler/target/debug/whitefootc.exe \
            tests/programs/completion_read_boundary.wf \
            -o "$RUNNER_TEMP/whitefoot-e2e/completion-read-boundary.exe" \
            2> "$driver_diagnostics" || {
              status="$?"
              while IFS= read -r line; do
                line="${line//%/%25}"
                line="${line//$'\r'/%0D}"
                echo "::error title=Windows whitefootc diagnostic::${line}"
              done < "$driver_diagnostics"
              fail_e2e "whitefootc failed to compile or link the program" "$status"
            }
          printf 'A' > "$RUNNER_TEMP/whitefoot-e2e/first.bin"
          printf 'B' > "$RUNNER_TEMP/whitefoot-e2e/second.bin"
          printf 'AB' > "$RUNNER_TEMP/whitefoot-e2e/expected.txt"
          (
            cd "$RUNNER_TEMP/whitefoot-e2e"
            WF_REQUIRE_WINDOWS_IOCP=1 ./completion-read-boundary.exe \
              first.bin second.bin \
              > actual.txt 2> diagnostics.txt
          ) || fail_e2e "the compiled program failed under the IOCP requirement" "$?"
          cmp "$RUNNER_TEMP/whitefoot-e2e/expected.txt" \
            "$RUNNER_TEMP/whitefoot-e2e/actual.txt" || \
            fail_e2e "the compiled program produced the wrong bytes" "$?"
          test ! -s "$RUNNER_TEMP/whitefoot-e2e/diagnostics.txt" || \
            fail_e2e "the compiled program wrote diagnostics" "$?"

      # U+4241 is one native UTF-16 code unit whose little-endian memory bytes
      # are 0x41, 0x42. The program measures the HostString, copies its complete
      # lossless route, and requires bytes 0x41, 0x42. This is the native
      # qualification record for the wider-code-unit [SYS-9] target row.
      - name: Run the Windows HostString raw-code-unit boundary
        shell: pwsh
        run: |
          $program = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/host-string-bytes.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/host-string-bytes.out"
          $stderr = Join-Path $env:RUNNER_TEMP "whitefoot-e2e/host-string-bytes.err"
          & ".\compiler\target\debug\whitefootc.exe" "tests/programs/host_string_bytes.wf" -o $program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $argument = [string][char]0x4241
          & $program $argument > $stdout 2> $stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $stdout).Length -ne 0) {
            throw "the HostString boundary wrote stdout"
          }
          if ((Get-Item $stderr).Length -ne 0) {
            throw "the HostString boundary wrote stderr"
          }

      # Correct bytes alone would also be produced by a sequential fallback.
      # The production driver must preserve those bytes and reject malformed
      # pool configuration. Then the same real Whitefoot module is linked with
      # a test-only identity observer. Its counters are compiled out of every
      # production binary; this observed build requires a started non-owner
      # worker to have executed and stolen at least one source task.
      - name: Require native workers for a real --par program
        run: |
          fail_par() {
            local stage="$1"
            local status="${2:-1}"
            echo "::error title=Windows native parallel runtime::${stage}"
            exit "$status"
          }
          par_dir="$RUNNER_TEMP/whitefoot-e2e/windows-par"
          mkdir -p "$par_dir"
          compiler/target/debug/whitefootc.exe \
            tests/programs/par_layout.wf \
            -o "$par_dir/par-layout-reference.exe" || \
            fail_par "the sequential reference did not link" "$?"
          compiler/target/debug/whitefootc.exe --par \
            tests/programs/par_layout.wf \
            -o "$par_dir/par-layout-production.exe" || \
            fail_par "the production --par executable did not link" "$?"
          compiler/target/debug/whitefootc.exe --par --emit-llvm \
            tests/programs/par_layout.wf \
            -o "$par_dir/par-layout.ll" || \
            fail_par "the observed --par module did not emit" "$?"

          "$par_dir/par-layout-reference.exe" \
            > "$par_dir/reference.txt" 2> "$par_dir/reference.err" || \
            fail_par "the sequential reference failed" "$?"
          set +e
          WF_WORKERS=4 \
            "$par_dir/par-layout-production.exe" \
            > "$par_dir/production.txt" 2> "$par_dir/production.err"
          production_status="$?"
          set -e
          if test "$production_status" -ne 0; then
            sed 's/^/native parallel production: /' \
              "$par_dir/production.err" >&2
            fail_par \
              "the production --par executable failed" \
              "$production_status"
          fi
          cmp "$par_dir/reference.txt" "$par_dir/production.txt" || \
            fail_par "native workers changed the program bytes" "$?"
          test ! -s "$par_dir/reference.err" || \
            fail_par "the sequential reference wrote diagnostics"
          test ! -s "$par_dir/production.err" || \
            fail_par "the native worker run wrote diagnostics"

          set +e
          WF_WORKERS=not-a-count "$par_dir/par-layout-production.exe" \
            > "$par_dir/invalid.txt" 2> "$par_dir/invalid.err"
          invalid_status="$?"
          set -e
          test "$invalid_status" -ne 0 || \
            fail_par "malformed WF_WORKERS silently selected a fallback"
          test ! -s "$par_dir/invalid.txt" || \
            fail_par "the rejected configuration entered the Whitefoot program"
          grep -Fx \
            'whitefoot parallel runtime: WF_WORKERS must be an integer from 2 through 64' \
            "$par_dir/invalid.err" > /dev/null || \
            fail_par "the configuration failure did not identify the runtime cause"

          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -municode \
            -DWF_PAR_IDENTITY_PROBE=1 \
            -I compiler/src/backend \
            -I compiler/src/backend/completion \
            compiler/src/backend/par_runtime_windows.c \
            compiler/src/backend/windows_runtime.c \
            compiler/src/backend/wf_floor_windows.c \
            compiler/src/backend/completion/windows_completion.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/windows_bridge.c \
            compiler/src/backend/completion/writer_scheduler_windows.c \
            compiler/src/backend/par_runtime_windows_probe.c \
            -x ir "$par_dir/par-layout.ll" \
            -Wno-override-module \
            -o "$par_dir/par-layout-observed.exe" || \
            fail_par "the native identity executable did not link" "$?"
          WF_WORKERS=4 "$par_dir/par-layout-observed.exe" \
            > "$par_dir/observed.txt" 2> "$par_dir/observed.err" || {
              status="$?"
              sed 's/^/native parallel observer: /' "$par_dir/observed.err" >&2
              fail_par "no non-owner worker executed source work" "$status"
            }
          cmp "$par_dir/reference.txt" "$par_dir/observed.txt" || \
            fail_par "the observed native run changed the program bytes" "$?"
          tr -d $'\r' < "$par_dir/observed.err" > "$par_dir/observed.normalized"
          test "$(wc -l < "$par_dir/observed.normalized")" -eq 1 || \
            fail_par "the identity run wrote unexpected diagnostics"
          grep -E \
            '^windows-native-par-probe status=pass started=[1-9][0-9]* executed=[1-9][0-9]* grants=[1-9][0-9]*$' \
            "$par_dir/observed.normalized" > /dev/null || \
            fail_par "the identity record did not prove native worker execution"

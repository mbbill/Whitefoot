# Completion I/O evidence from hosts the maintainer's machine cannot produce:
# a real Linux kernel on real hardware, Windows at all, and an ordinary macOS
# system without a corporate endpoint-security stack in the I/O path.
#
# Everything the repository knew about Linux io_uring came from a container on
# an aarch64 virtual machine, everything it knew about Windows IOCP came from
# a cross-link that was never executed, and every macOS number it had was
# taken on a machine that charges 116 us for an `openat`. These jobs close
# those gaps with runs rather than with builds. A correctness job here fails
# loudly rather than recording a fallback: `completion-linux` requires
# io_uring, and `completion-windows` reports the exact failure instead of
# being marked expected-to-fail. The bench jobs record; they state the host
# and the measured cache state beside every table rather than asserting one.
name: io-hosts

on:
  push:
  workflow_dispatch:

concurrency:
  group: io-hosts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  completion-linux:
    name: completion-linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          test -x /usr/bin/clang
          /usr/bin/clang --version

      - name: Record the kernel
        run: |
          uname -srvmo
          nproc
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'absent')"

      # The compiler's own `completion-test` tolerates exit 77 from this probe,
      # because a build host is allowed to lack io_uring. A CI job whose whole
      # purpose is native-adapter evidence must not: 77 here is a failure, so
      # a silent fallback can never be reported as an io_uring result.
      - name: Native io_uring adapter probe (required)
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          /usr/bin/clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -pthread \
            -DWF_COMPLETION_GETDIRENTRIES64=wf_completion_test_getdirentries64 \
            -DWF_COMPLETION_POLL=wf_completion_test_poll \
            compiler/src/backend/completion/runtime.c \
            compiler/src/backend/completion/linux_io_uring.c \
            compiler/src/backend/completion/native_adapter_probe.c \
            -o "$RUNNER_TEMP/completion/linux-native-probe"
          set +e
          "$RUNNER_TEMP/completion/linux-native-probe" "$RUNNER_TEMP/completion/probe.data"
          status=$?
          set -e
          echo "native adapter probe exit status: $status"
          if [ "$status" -eq 77 ]; then
            echo "io_uring is unavailable on this runner; this job reports that as a failure rather than as a pass on the fallback path" >&2
            exit 1
          fi
          exit "$status"

      - name: Completion harness
        run: make -C compiler completion-test CC=/usr/bin/clang

      # `completion-test` re-runs the harness under WF_REQUIRE_LINUX_IO_URING
      # at one helper count only. Naming all three here states that the
      # required-io_uring path holds across the helper policies the runtime
      # actually selects between.
      - name: Completion harness with io_uring required
        run: |
          harness="$HOME/do_not_scan/whitefoot-completion-test/harness"
          for helpers in 0 1 4; do
            echo "== WF_REQUIRE_LINUX_IO_URING=1 WF_IO_HELPERS=$helpers =="
            WF_REQUIRE_LINUX_IO_URING=1 WF_IO_HELPERS="$helpers" \
              "$harness" "$HOME/do_not_scan/whitefoot-completion-test"
          done

      - name: Address and undefined sanitizers
        run: make -C compiler completion-sanitize CC=/usr/bin/clang

      - name: Thread sanitizer
        run: make -C compiler completion-core-read-tsan CC=/usr/bin/clang

      - name: Thread sanitizer over the bridge and the ring
        run: make -C compiler completion-tsan CC=/usr/bin/clang

  bench-linux:
    name: bench-linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-linux-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-linux-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-linux-

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # A shared runner is noisy, so the reading has to carry its own spread
      # and the record has to say what machine produced it.
      - name: Record the host
        run: |
          {
            echo "kernel: $(uname -srvmo)"
            echo "cpus: $(nproc)"
            echo "model: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
            echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo absent)"
            echo "bench filesystem: $(findmnt -no SOURCE,FSTYPE --target "$RUNNER_TEMP")"
            echo "bench free space: $(df -h --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
          } | tee host.txt

      - name: Run the Linux bench protocol
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "9"
          WARMUP: "2"
        run: |
          export OUT="$RUNNER_TEMP/io-completion-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/linux-bench.sh 2>&1 | tee bench.txt

      - name: Publish the table
        if: always()
        run: |
          {
            echo '## bench-linux'
            echo
            echo '```text'
            cat host.txt
            echo
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux
          path: |
            host.txt
            bench.txt

  # The read-dominated tables, on hosts the maintainer's machine cannot stand
  # in for. The macOS job matters twice over: its numbers are the first clean
  # macOS numbers this project has, because the maintainer's machine runs a
  # corporate endpoint-security stack that charges 116 us for an `openat` and
  # reads the benchmark tree behind the benchmark's back. A hosted macOS
  # runner has neither.
  #
  # Both jobs run `read-bench.sh`, the same bytes the `linux-read` container
  # target runs. It labels each table by what the residency probe measured
  # rather than refusing to print one, because a hosted runner's storage is
  # not known in advance; a table whose probe refused the label says so on its
  # own label line.
  bench-linux-read:
    name: bench-linux-read (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-linux-read-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-linux-read-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-linux-read-

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # A table taken on a shared runner is only readable beside the machine
      # that produced it, and the storage matters more here than anywhere
      # else: this workload is a measurement of what one read costs.
      - name: Record the host
        run: |
          {
            echo "kernel: $(uname -srvmo)"
            echo "cpus: $(nproc)"
            echo "model: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
            echo "memory: $(awk '/^MemTotal/ {print $2 " kB"}' /proc/meminfo)"
            echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo absent)"
            echo "bench filesystem: $(findmnt -no SOURCE,FSTYPE --target "$RUNNER_TEMP")"
            echo "bench free space: $(df -h --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
            echo "rotational: $(lsblk -no NAME,ROTA 2>/dev/null | tr '\n' ' ')"
            echo "load: $(cat /proc/loadavg)"
          } | tee host-read.txt

      - name: Run the read-heavy protocol
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "7"
          WARMUP: "2"
        run: |
          export OUT="$RUNNER_TEMP/io-read-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/read-bench.sh 2>&1 | tee bench-read.txt

      - name: Publish the tables
        if: always()
        run: |
          {
            echo '## bench-linux-read'
            echo
            echo '```text'
            cat host-read.txt
            echo
            cat bench-read.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux-read
          path: |
            host-read.txt
            bench-read.txt

  bench-macos-read:
    name: bench-macos-read (macos-14)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-macos-read-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-macos-read-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-macos-read-

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Record the host
        run: |
          {
            echo "kernel: $(uname -srvm)"
            echo "product: $(sw_vers -productName) $(sw_vers -productVersion)"
            echo "cpus: $(sysctl -n hw.ncpu)"
            echo "model: $(sysctl -n machdep.cpu.brand_string)"
            echo "memory: $(sysctl -n hw.memsize)"
            echo "bench filesystem: $(df -h "$RUNNER_TEMP" | tail -1)"
            echo "load: $(sysctl -n vm.loadavg)"
          } | tee host-read.txt

      - name: Run the read-heavy protocol
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "7"
          WARMUP: "2"
        run: |
          export OUT="$RUNNER_TEMP/io-read-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/read-bench.sh 2>&1 | tee bench-read.txt

      # The many-files workload, which every earlier macOS table measured on
      # the maintainer's machine. There an `openat` costs 116 us and the table
      # is mostly a measurement of the endpoint-security stack; here there is
      # no such stack, so this is the first reading of that workload's open
      # path on an ordinary macOS system.
      - name: Run the many-files protocol
        if: always()
        env:
          ROUNDS: "7"
          WARMUP: "2"
        run: |
          export WHITEFOOT_SCRATCH_ROOT="$RUNNER_TEMP/scratch"
          make -C research/experiments/io-completion-bench bench 2>&1 | tee bench-many.txt

      - name: Publish the tables
        if: always()
        run: |
          {
            echo '## bench-macos-read'
            echo
            echo '```text'
            cat host-read.txt
            echo
            cat bench-read.txt
            echo
            cat bench-many.txt 2>/dev/null || echo "the many-files table did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-macos-read
          path: |
            host-read.txt
            bench-read.txt
            bench-many.txt

  completion-windows:
    name: completion-windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record the host
        run: |
          clang --version
          systeminfo | grep -E '^(OS Name|OS Version|System Type|Total Physical Memory)' || true

      # The first execution of the Windows completion path anywhere. Until
      # now `make -C compiler completion-windows-cross` proved only that these
      # units link into a PE that imports the IOCP entries; whether the
      # adapter drives a real completion port was unknown.
      - name: Build the Windows completion probe
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend/completion \
            compiler/src/backend/completion/windows_completion.c \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/windows_completion_probe.c \
            -o "$RUNNER_TEMP/completion/windows-completion-probe.exe"

      - name: Run the Windows completion probe
        run: |
          "$RUNNER_TEMP/completion/windows-completion-probe.exe" \
            "$RUNNER_TEMP/completion/probe.data"

      - name: Build the Windows native adapter probe
        run: |
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            -I compiler/src/backend/completion \
            compiler/src/backend/completion/windows_iocp.c \
            compiler/src/backend/completion/native_adapter_probe.c \
            -o "$RUNNER_TEMP/completion/windows-adapter-probe.exe"

      - name: Run the Windows native adapter probe
        run: |
          "$RUNNER_TEMP/completion/windows-adapter-probe.exe" \
            "$RUNNER_TEMP/completion/adapter.data"

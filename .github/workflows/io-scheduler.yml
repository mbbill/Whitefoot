# One host, alternating samples, all candidate forms built from one revision.
# This is the temporary experiment owned by io-model/SCHEDULER-EXPERIMENT.md.
name: io-scheduler

on:
  workflow_dispatch:
  push:
    branches: ['codex/io-idle-retry']
    paths:
      - 'compiler/src/backend/sched/**'
      - 'compiler/src/backend/emitter/**'
      - 'compiler/src/backend/emitter.rs'
      - 'research/experiments/io-completion-bench/*.c'
      - 'research/experiments/io-completion-bench/*.h'
      - 'research/experiments/io-completion-bench/programs/tcp*_server.wf'
      - 'research/experiments/io-completion-bench/scheduler-bench.sh'
      - '.github/workflows/io-scheduler.yml'

concurrency:
  group: io-scheduler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (${{ matrix.experiment }})
    strategy:
      fail-fast: false
      matrix:
        experiment: [idle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang time
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Measure scheduler policies on this host
        env:
          ROOT: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/io-scheduler
          CARGO_TARGET_DIR: ${{ github.workspace }}/compiler/target
          ROUNDS: '7'
          WARMUP: '2'
          EXPERIMENT: ${{ matrix.experiment }}
        run: bash research/experiments/io-completion-bench/scheduler-bench.sh bench
      - name: Publish measurement summary
        if: always()
        run: |
          {
            echo '## Scheduler experiment: ${{ matrix.experiment }}'
            echo 'Paired within this job and CPU cohort. Idle: six policies and four placements. Mixed network/compute: base, sleep, poll1 and inline epoll, shared4 and split2. See the investigation for the protocol and scope.'
            echo '```text'
            for file in host.txt cohorts.tsv network-summary.txt compute.txt mixed.txt; do
              cat "$RUNNER_TEMP/io-scheduler/$file" 2>/dev/null || echo "$file was not produced"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: io-scheduler-${{ matrix.experiment }}
          path: |
            ${{ runner.temp }}/io-scheduler/host.txt
            ${{ runner.temp }}/io-scheduler/*.tsv
            ${{ runner.temp }}/io-scheduler/*.txt
            ${{ runner.temp }}/io-scheduler/*.err
            ${{ runner.temp }}/io-scheduler/*.plan
            ${{ runner.temp }}/io-scheduler/observed/
            ${{ runner.temp }}/io-scheduler/samples/

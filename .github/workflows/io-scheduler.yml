# One host, alternating samples, all candidate forms built from one revision.
# This is the temporary experiment owned by io-model/SCHEDULER-EXPERIMENT.md.
name: io-scheduler

on:
  workflow_dispatch:
  push:
    branches: ['codex/io-scheduler-experiments']
    paths:
      - 'compiler/src/backend/sched/**'
      - 'compiler/src/backend/completion/**'
      - 'compiler/src/backend/emitter/**'
      - 'compiler/src/backend/emitter.rs'
      - 'compiler/src/lowering/**'
      - 'compiler/src/lowering.rs'
      - 'compiler/src/driver.rs'
      - 'compiler/src/bin/whitefootc.rs'
      - 'research/experiments/io-completion-bench/*.c'
      - 'research/experiments/io-completion-bench/*.h'
      - 'research/experiments/io-completion-bench/programs/tcp*_server.wf'
      - 'research/experiments/io-completion-bench/scheduler-bench.sh'
      - '.github/workflows/io-scheduler.yml'

concurrency:
  group: io-scheduler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (${{ matrix.experiment }})
    strategy:
      fail-fast: false
      matrix:
        experiment: [shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang time
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Measure scheduler policies on this host
        env:
          ROOT: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/io-scheduler
          CARGO_TARGET_DIR: ${{ github.workspace }}/compiler/target
          ROUNDS: '7'
          WARMUP: '2'
          EXPERIMENT: ${{ matrix.experiment }}
        run: bash research/experiments/io-completion-bench/scheduler-bench.sh bench
      - name: Publish measurement summary
        if: always()
        run: |
          {
            echo '## Scheduler experiment: ${{ matrix.experiment }}'
            echo 'Paired within this job and CPU cohort. Global FIFO versus worker FIFOs sharing a mutex versus those same FIFOs with independent mutexes. Identical emitted programs, completion engine and stack layout; 1/4/64/1024 connections, small/large payloads, pure-compute and warm-file controls. See the investigation for scope.'
            echo '```text'
            for file in host.txt cohorts.tsv network-summary.txt compute.txt mixed.txt; do
              cat "$RUNNER_TEMP/io-scheduler/$file" 2>/dev/null || echo "$file was not produced"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: io-scheduler-${{ matrix.experiment }}
          path: |
            ${{ runner.temp }}/io-scheduler/host.txt
            ${{ runner.temp }}/io-scheduler/*.tsv
            ${{ runner.temp }}/io-scheduler/*.txt
            ${{ runner.temp }}/io-scheduler/*.err
            ${{ runner.temp }}/io-scheduler/*.plan
            ${{ runner.temp }}/io-scheduler/*.log
            ${{ runner.temp }}/io-scheduler/observed/
            ${{ runner.temp }}/io-scheduler/samples/
            ${{ runner.temp }}/io-scheduler/codegen/

  windows-shards:
    name: native Windows ready-queue checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler and fixed input
        run: |
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          cargo build --profile gate --locked --offline --manifest-path compiler/Cargo.toml --bin whitefootc
          mkdir -p "$RUNNER_TEMP/shards"
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic \
            research/experiments/io-completion-bench/gen.c -o "$RUNNER_TEMP/shards/gen.exe"
          "$RUNNER_TEMP/shards/gen.exe" "$RUNNER_TEMP/shards/tree" 2 65536 fixed
          compiler/target/gate/whitefootc.exe --par --emit-llvm \
            research/experiments/io-completion-bench/programs/windows_runtime_mixed.wf \
            -o "$RUNNER_TEMP/shards/mixed.ll"
      - name: Check all queue policies with actual IOCP traffic
        run: |
          backend="$GITHUB_WORKSPACE/compiler/src/backend"
          units=(sched/core.c sched/prim_windows.c sched/entry.c
                 completion/runtime.c completion/wait_windows.c completion/file_adapter.c
                 completion/file_windows.c completion/bridge.c completion/windows_iocp.c
                 windows_runtime.c wf_floor_windows.c sched/grant_observer.c)
          sources=()
          for unit in "${units[@]}"; do sources+=("$backend/$unit"); done
          for policy in 0 1 2; do
            clang -std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -municode \
              -I "$backend" -I "$backend/completion" -DWF_SCHED_OBSERVE=1 \
              "-DWF_SCHED_READY_SHARDS=$policy" -x c "${sources[@]}" \
              -x ir "$RUNNER_TEMP/shards/mixed.ll" -Wno-override-module \
              -o "$RUNNER_TEMP/shards/mixed-$policy.exe" -lws2_32
            for workers in 2 4; do
              record="$RUNNER_TEMP/shards/p$policy-w$workers"
              (cd "$RUNNER_TEMP/shards/tree" && \
                WF_WORKERS="$workers" WF_SCHED_REPORT=1 WF_REQUIRE_WINDOWS_IOCP=1 \
                "$RUNNER_TEMP/shards/mixed-$policy.exe" f00000.dat f00001.dat) \
                > "$record.out" 2> "$record.err"
              tr -d '\r' < "$record.out" > "$record.actual"
              printf '17574306422404092952\n' > "$record.expected"
              cmp "$record.expected" "$record.actual"
              awk -v policy="$policy" '/^sched:/ { seen=1; for(i=2;i<=NF;i++) {split($i,a,"=");v[a[1]]=a[2]+0} }
                END {exit !(seen && ("ready_shards" in v) && v["ready_shards"]==policy && v["parks"]>0 && v["resumes"]>0)}' "$record.err"
              cat "$record.err"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: io-scheduler-windows-shards
          path: |
            ${{ runner.temp }}/shards/*.out
            ${{ runner.temp }}/shards/*.err
            ${{ runner.temp }}/shards/*.actual
            ${{ runner.temp }}/shards/*.expected

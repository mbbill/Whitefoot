# Disposable, untimed pointer-provenance replay for the ac34 records artifact.
# It runs the exact downloaded images under gdb and discards every timing row.
# This manual-only workflow is removed with the research branch.
name: records-data-placement-provenance
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: records-data-placement-provenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provenance:
    name: observe records result pointers (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Identify host and debugger
        run: |
          mkdir -p "$RUNNER_TEMP/data-placement"
          {
            printf 'workflow_run=%s\nworkflow_sha=%s\nworkflow_ref=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF"
            date -u '+date=%Y-%m-%dT%H:%M:%SZ'
            uname -a
            nproc
            lscpu
            taskset -pc $$
            if command -v gdb >/dev/null; then
              gdb --version
            else
              echo 'gdb=unavailable; stopping without installing infrastructure'
              exit 3
            fi
          } > "$RUNNER_TEMP/data-placement/PROVENANCE.txt"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - name: Download and identify the exact ac34 images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ac34"
          gh run download 35527433610 --repo "$GITHUB_REPOSITORY" \
            --name compute-regression-ubuntu-24.04 \
            --dir "$RUNNER_TEMP/ac34"
          identity="$RUNNER_TEMP/ac34/performance-results/identity.txt"
          test -f "$identity"
          grep -Fx 'candidate=8609625800d60cab59e302b744917ed1073536ed' "$identity"
          grep -Fx 'baseline=c12d6dd10d7a536507b30523dd9837a52c915028' "$identity"
          grep -Fx 'native=-O2; ordinary host runtime; no alignment overrides' "$identity"
      - name: Observe release pointers outside the measured interval
        env:
          WHITEFOOT_CHECK_TIMEOUT: 300
        run: |
          perl .github/run-check.pl records-data-placement-provenance \
            bash research/investigations/access-effects/data-placement-provenance/observe.sh \
            "$RUNNER_TEMP/ac34" "$RUNNER_TEMP/data-placement"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-data-placement-provenance-ubuntu-24.04
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ac34/performance-results/identity.txt
            ${{ runner.temp }}/data-placement/

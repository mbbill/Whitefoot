# Pure-compute calibration. Correctness remains in canonical research-tests;
# these elapsed times never select acceptance or turn into timing gate limits.
name: compute-bench

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/experiments/compute-runtime/**'
      - '.github/workflows/compute-bench.yml'

concurrency:
  group: compute-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-linux:
    name: ${{ matrix.workload }}-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - workload: fir
            arch: -march=native
            checks: check-fir check-bench
            driver: fir-bench.sh
          - workload: records
            arch: -march=native
            checks: check-records
            driver: records-bench.sh
          - workload: scheduler
            arch: -march=x86-64-v3
            checks: check-scheduler-layout
            driver: records-scheduler-bench.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and record compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          /usr/bin/clang --version
      - name: Fetch pinned native schedulers
        if: matrix.workload == 'scheduler'
        env:
          OUT: ${{ runner.temp }}/compute-${{ matrix.workload }}
        run: make -C research/experiments/compute-runtime scheduler-fetch OUT="$OUT"
      - name: Qualify sources and actual timing objects
        env:
          OUT: ${{ runner.temp }}/compute-${{ matrix.workload }}
        run: |
          set -o pipefail
          make -C research/experiments/compute-runtime ${{ matrix.checks }} \
            OUT="$OUT" BENCH_ARCH=${{ matrix.arch }} 2>&1 | tee "$RUNNER_TEMP/compute-${{ matrix.workload }}-build.log"
      - name: Calibrate sequentially on one recorded CPU mask
        env:
          OUT: ${{ runner.temp }}/compute-${{ matrix.workload }}
        run: |
          # Restrict the experiment to at most four available logical CPUs.
          # Children inherit this mask; topology/SMT/quota remain in the record.
          mask=$(awk '/Cpus_allowed_list/ {print $2}' /proc/self/status)
          selected=$(awk -v list="$mask" 'BEGIN {
            n=split(list,parts,","); count=0;
            for(i=1;i<=n && count<4;i++) {
              m=split(parts[i],range,"-"); last=(m==1?range[1]:range[2]);
              for(cpu=range[1];cpu<=last && count<4;cpu++) {
                printf "%s%d", count?",":"",cpu; count++
              }
            }
          }')
          test -n "$selected"
          taskset -c "$selected" env ROUNDS=5 RESULTS="$OUT/calibration" \
            sh research/experiments/compute-runtime/${{ matrix.driver }} calibrate
          if test '${{ matrix.workload }}' = scheduler; then
            taskset -c "$selected" env ROUNDS=5 RESULTS="$OUT/layout-calibration" \
              sh research/experiments/compute-runtime/records-scheduler-bench.sh layout
          fi
      - name: Publish calibration location and scope
        if: always()
        env:
          OUT: ${{ runner.temp }}/compute-${{ matrix.workload }}
        run: |
          {
            echo '## ${{ matrix.workload }} compute calibration'
            echo 'Same-host raw calls, per-process warm means/ranges and exact objects are in the artifact.'
            echo 'This screen is not held-out confirmation or a fastest-runtime claim.'
            if test -f "$OUT/calibration/summary.tsv"; then
              echo "Retained process rows: $(awk 'END {print NR-1}' "$OUT/calibration/summary.tsv")"
            fi
            if test -f "$OUT/layout-calibration/summary.tsv"; then
              echo "Shared-image layout process rows: $(awk 'END {print NR-1}' "$OUT/layout-calibration/summary.tsv")"
              echo 'This control shares leaf/callback addresses and adds common indirect dispatch plus loaded libraries.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compute-${{ matrix.workload }}-linux
          # The scheduler manifest hashes Cargo's hidden build fingerprints.
          # These paths contain generated experiment output, not source caches.
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/compute-${{ matrix.workload }}-build.log
            ${{ runner.temp }}/compute-${{ matrix.workload }}/calibration/
            ${{ runner.temp }}/compute-${{ matrix.workload }}/layout-calibration/
            ${{ runner.temp }}/compute-${{ matrix.workload }}/*check-*/
            ${{ runner.temp }}/compute-${{ matrix.workload }}/bench-*
            ${{ runner.temp }}/compute-${{ matrix.workload }}/fir*
            ${{ runner.temp }}/compute-${{ matrix.workload }}/records*
            ${{ runner.temp }}/compute-${{ matrix.workload }}/scheduler-*

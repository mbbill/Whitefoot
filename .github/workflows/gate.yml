# The canonical gate on hosts the project does not own.
#
# `make check` is the repository's one all-tests entry point, and until this
# workflow existed it had only ever run on the maintainer's macOS machine. The
# Linux half of the compiler — the io_uring adapter, the `__linux__` bodies of
# every compiler-owned C unit, the ELF link path — was covered by a container
# on that same machine or by nothing at all. These jobs run the identical
# entry point on a GitHub-hosted Linux runner and on a GitHub-hosted macOS
# runner, so a Linux result is a real x86-64 Linux kernel rather than a
# virtualized aarch64 guest.
#
# The gate is split by stage rather than run as one `make check` per host,
# because a gate people wait half a day for is a gate people stop running. One
# host's `make check` is a sum; six jobs on that host are a maximum. Every job
# runs the *same* make targets `check` runs — `Makefile`'s `CHECK_STAGES` and
# `compiler/Makefile`'s `COMPILER_STAGES` are the authority for what belongs to
# the gate, and the `run` lines below name those targets and nothing else — so
# nothing is checked here that a maintainer's single local `make check` does
# not also check, and nothing is skipped here that it runs.
name: gate

on:
  push:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  gate:
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The budget, enforced where it cannot flake. Eight minutes is the ceiling,
    # not the target: the target is five, and a job that reaches eight has a
    # defect worth failing over rather than waiting out. No test asserts a wall
    # time — a wall-clock assertion inside a test is a flake generator — so this
    # is the only place a time is a pass/fail condition.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        stage: [static, unit, sampling, corpus, conformance, research]
        include:
          # Everything that reads the tree without running a compiled program.
          - stage: static
            run: >-
              make repository-invariants approval-history-integrity
              spec-append-only spec-archive-integrity spec-digest-sync
              && make -C compiler static
          # The fast half of the library suite, plus the partition proof that
          # the two halves between them are the whole suite.
          - stage: unit
            run: make -C compiler test-partition test-unit
          # The half whose cases link a program and run it many times.
          - stage: sampling
            run: make -C compiler test-sampling
          # The integration targets: real programs, compiled and linked.
          - stage: corpus
            run: make -C compiler test-corpus
          # The conformance corpus, through its own runner and then through the
          # native adapter.
          - stage: conformance
            run: make conformance && make conformance-run
          # The maintained executable tests under `research/`.
          - stage: research
            run: make research-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `approval-history-integrity` and `spec-append-only` read `main` as a
      # local ref: the approval history must be an exact prefix of main's, and
      # no released specification archive may differ from main's. A CI checkout
      # has the remote-tracking ref only, so name it locally here.
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          git log --oneline -1 main

      - name: Install the host toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang
          fi
          test -x /usr/bin/clang
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      # What is worth caching is what a run can actually reuse. The compiler
      # crate has no dependencies at all — `compiler/Cargo.lock` names one
      # package, itself — so a cached `compiler/target` can only be reused by a
      # commit that changed no compiler source, which on a work branch is
      # almost none of them. It was in the cache anyway, under a key ending in
      # `github.sha`: the exact key therefore missed on every commit, so every
      # job uploaded a fresh several-hundred-megabyte cache that the next
      # commit could not use and that pushed older entries out of the
      # repository's ten-gigabyte budget. Seventeen seconds of restore and
      # fifteen of save, per job, to warm nothing.
      #
      # What does get reused is the crate registry and the research
      # experiments' own build directory: those crates have real dependencies
      # and their sources change perhaps twice a year. Keyed on the lock files
      # alone, the exact key hits on every run of an unchanged lock file, so
      # the cache is written once per dependency change instead of once per
      # commit.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/do_not_scan/whitefoot-research-tests-target
          key: gate-${{ matrix.os }}-deps-${{ hashFiles('compiler/Cargo.lock', 'research/**/Cargo.lock') }}
          restore-keys: |
            gate-${{ matrix.os }}-deps-

      # `make check` builds every crate `--locked --offline`, which is what
      # makes its result a property of the recorded lock files. Offline needs a
      # populated registry, so the one network step is here, explicitly.
      - name: Fetch the recorded crate dependencies
        run: |
          for manifest in \
            compiler/Cargo.toml \
            research/experiments/frequency-study/reassociation/Cargo.toml \
            research/experiments/default-floor/utf8parse/rust-baseline/Cargo.toml \
            research/experiments/default-floor/utf8parse/harness/Cargo.toml \
            research/experiments/default-floor/percent-decode/rust-baseline/Cargo.toml \
            research/experiments/default-floor/percent-decode/harness/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
          done

      - name: Record the host
        run: |
          uname -a
          if [ "$RUNNER_OS" = Linux ]; then
            nproc
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          else
            sysctl -n hw.ncpu
          fi
          echo "core file limit: $(ulimit -c)"
          df -h .

      # Every line the stage prints, stamped with the moment it arrived. The
      # report step below turns that into the ranking; nothing here changes
      # what runs.
      - name: ${{ matrix.stage }}
        run: |
          set -o pipefail
          ${{ matrix.run }} 2>&1 \
            | perl -MTime::HiRes=time -ne 'BEGIN { $| = 1 } printf "%.3f %s", time, $_' \
            | tee "$RUNNER_TEMP/stage.log" \
            | cut -d' ' -f2-

      # A budget holds only while somebody can see it slipping. This prints the
      # ten largest gaps between one case reporting and the next, so the case
      # that grew is named in the run that grew it.
      #
      # It is a ranking of gaps, not a table of durations: cargo runs the cases
      # of one target on as many threads as the host has cores, so a gap is a
      # lower bound on the wall of the case that closed it, and a case that ran
      # entirely beside a slower one can be invisible. That is enough for the
      # job it has — a case that goes from milliseconds to minutes closes a
      # minutes-long gap on any host — and it costs no test time, which a real
      # per-case measurement on stable Rust would.
      - name: Ten largest gaps in ${{ matrix.stage }}
        if: always()
        run: |
          test -s "$RUNNER_TEMP/stage.log" || exit 0
          {
            echo "### ${{ matrix.stage }} (${{ matrix.os }}) — ten largest completion gaps"
            echo
            echo 'Seconds between one case reporting and the previous one, so a lower'
            echo 'bound on the wall of the case that closed the gap.'
            echo
            echo '```text'
            awk '{ moment = $1; $1 = ""; if (previous != "") printf "%8.1f%s\n", moment - previous, $0; previous = moment }' \
              "$RUNNER_TEMP/stage.log" \
              | grep -E '\.\.\. (ok|FAILED|ignored)$' \
              | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  # TEMPORARY, batch 0093. The discriminating measurement behind
  # `compiler/Makefile`'s `NO_CORE_DUMPS`: one case, one tree, one host, run
  # twice, differing only in the core-file limit the spawned programs inherit.
  # Delete this job once its numbers are in `docs/done/0093-gate-budget.md`.
  core-dump-cost:
    name: core-dump cost (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          rustup default stable
      - name: Record the host
        run: |
          nproc
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          echo "core file limit: $(ulimit -c)"
      - name: The racing-claim case at the host's own core limit
        run: |
          ulimit -c
          cd compiler
          time cargo test --profile gate --lib --locked --offline -- --exact \
            backend::tests::trap_latch::a_racing_pair_of_false_claims_writes_exactly_one_record
      - name: The same case with core dumps off
        run: |
          ulimit -c 0
          ulimit -c
          cd compiler
          time cargo test --profile gate --lib --locked --offline -- --exact \
            backend::tests::trap_latch::a_racing_pair_of_false_claims_writes_exactly_one_record

[package]
name = "whitefoot"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
doctest = false

[[bin]]
name = "whitefoot-spec"
path = "src/bin/spec.rs"

[[bin]]
name = "whitefoot-grammar"
path = "src/bin/grammar.rs"

[[bin]]
name = "whitefoot-grammar-tables"
path = "src/bin/grammar_tables/main.rs"

[[bin]]
name = "whitefoot-migrate"
path = "src/bin/migrate/main.rs"

[[bin]]
name = "whitefootc"
path = "src/bin/whitefootc.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

# Heavy owning tests run compute-bound front-end analysis on real programs;
# at the default unoptimized test profile that analysis was measured at 136s
# per wfgrep pass. This profile keeps every debug assertion and overflow
# check (release would drop them) and changes only code generation, so no
# test's identity or meaning moves. Used by `make -C compiler heavy`.
[profile.heavy]
inherits = "release"
debug-assertions = true
overflow-checks = true

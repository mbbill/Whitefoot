[package]
name = "whitefoot"
version = "0.1.0"
edition = "2024"
publish = false
# Minimum stable toolchain that builds the compiler. An `if let` match guard
# (semantic/entailment/flow.rs) needs the `if_let_guard` stabilization that
# landed in 1.95.0; rustc 1.94.x rejects it with E0658 and no hint to update.
# This makes cargo print "package requires rustc 1.95 or newer" instead of a
# confusing feature-gate error on an installed-but-stale stable toolchain
# (rustup does not update an installed stable on its own).
rust-version = "1.95"

[lib]
doctest = false

[[bin]]
name = "whitefootc"
path = "src/bin/whitefootc.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

# The gate's test profile. The suite's owning tests run compute-bound
# front-end analysis on real programs; at the default unoptimized test
# profile one wfgrep pass was measured at 136s against ~8s here. It keeps
# every debug assertion and overflow check (plain release would drop them)
# and changes only code generation, so no test's identity or meaning moves.
# Used by the Makefile `test` target; a bare `cargo test <filter>` during
# development still uses the default profile.
[profile.gate]
inherits = "release"
debug-assertions = true
overflow-checks = true

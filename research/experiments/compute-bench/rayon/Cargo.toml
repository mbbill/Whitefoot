# Serves compute-bench: the Rayon reference's crate. It builds one staticlib
# carrying both entry points, `map` and `fork2`, which backend_rayon.c binds
# by the v0-mangled symbols deps.sh recovers from the emitted LLVM IR. There
# is no feature axis and no second build: the two dispatch shapes and the two
# fork directions are ordinary run-time arguments.
[package]
name = "wf-compute-bench-rayon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "adapter.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
rayon = "=1.12.0"

[profile.release]
opt-level = 3
lto = false
panic = "abort"

[workspace]
